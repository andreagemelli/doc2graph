[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2graph"
version = "0.3.1b0"
description = "Doc2Graph transforms documents into graphs and exploit a GNN to solve several tasks. "
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core ML/DL frameworks
    "torch>=2.9.1",
    "torchvision>=0.24.0",
    "torch-geometric>=2.6.0",
    # Computer Vision
    "opencv-python>=4.8.0",
    "pillow>=10.3.0",
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
    "segmentation-models-pytorch>=0.2.0,<0.3.0",
    # Data processing
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    # NLP
    "spacy>=3.6.0,<4.0.0",
    # Utilities
    "pyyaml>=6.0",
    "wget>=3.2",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
    "en-core-web-lg",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pip-audit>=2.7.3",
    "jupyter>=1.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["doc2graph*"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# pyflakes + pycodestyle errors: real bugs (undefined names, unused vars, bare except, ...)
select = ["E4", "E7", "E9", "F"]
# style-only rules the existing code does not follow
ignore = ["E701", "E731", "E741"]
